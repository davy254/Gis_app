<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GIS Form Builder</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        earth: {
                            50:  '#f5f3ee',
                            100: '#e8e2d5',
                            200: '#d4c9b0',
                            400: '#9f8a67',
                            500: '#7d6a4f',
                            700: '#3e3426',
                            800: '#2a2219',
                        },
                        moss: '#4a6741',
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen bg-earth-50 py-10 px-4">

<div class="max-w-3xl mx-auto">

    <!-- Header -->
    <div class="mb-8">
        <span class="text-xs uppercase tracking-widest text-earth-500 font-semibold">
            GIS Survey Platform
        </span>

        <h1 class="text-3xl font-bold text-earth-800 mt-1">
            Create GIS Survey Form
        </h1>

        <div class="mt-2 h-0.5 w-16 bg-moss rounded"></div>
    </div>

    <!-- Card -->
    <div class="bg-white border border-earth-100 rounded-2xl shadow-sm p-6">

        <!-- Form Name -->
        <div class="mb-5">
            <label class="block text-sm font-semibold text-earth-700 mb-2">
                Form Name
            </label>

            <input
                type="text"
                id="form-name"
                class="w-full px-4 py-2 rounded-xl border border-earth-100
                       focus:outline-none focus:ring-2 focus:ring-moss"
                placeholder="Enter form name"
            >
        </div>

        <!-- Add Field Button -->
        <button
            onclick="addField()"
            class="bg-earth-700 text-white px-4 py-2 rounded-xl text-sm font-semibold
                   hover:bg-earth-800 transition-all duration-200"
        >
            + Add Field
        </button>

        <!-- Fields Container -->
        <div id="fields-container" class="mt-5 space-y-3"></div>

        <!-- Save Button -->
        <button
            onclick="saveForm()"
            class="mt-6 w-full bg-moss text-white px-4 py-3 rounded-xl font-semibold
                   hover:bg-green-900 transition-all duration-200"
        >
            Save Form
        </button>

    </div>
</div>

<script>
function addField() {
    const fieldHTML = `
        <div class="border border-earth-100 rounded-2xl p-4 bg-earth-50">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                <!-- Label -->
                <div>
                    <label class="block text-sm font-semibold text-earth-700 mb-2">
                        Field Label
                    </label>

                    <input
                        type="text"
                        class="field-label w-full px-3 py-2 rounded-xl border border-earth-200
                               focus:outline-none focus:ring-2 focus:ring-moss"
                        placeholder="Enter label"
                    >
                </div>

                <!-- Type -->
                <div>
                    <label class="block text-sm font-semibold text-earth-700 mb-2">
                        Field Type
                    </label>

                    <select
                        class="field-type w-full px-3 py-2 rounded-xl border border-earth-200
                               focus:outline-none focus:ring-2 focus:ring-moss"
                    >
                        <option value="text">Text</option>
                        <option value="number">Number</option>
                        <option value="dropdown">Dropdown</option>
                        <option value="date">Date</option>
                        <option value="gps">GPS</option>
                        <option value="photo">Photo</option>
                    </select>
                </div>

            </div>
        </div>
    `;

    document.getElementById("fields-container")
        .insertAdjacentHTML("beforeend", fieldHTML);
}

async function saveForm() {
    let labels = document.querySelectorAll(".field-label");
    let types = document.querySelectorAll(".field-type");

    let structure = [];

    for (let i = 0; i < labels.length; i++) {
        structure.push({
            label: labels[i].value,
            type: types[i].value
        });
    }

    let data = {
        name: document.getElementById("form-name").value,
        structure: structure
    };

    let response = await fetch("/api/forms/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCookie("csrftoken")
        },
        body: JSON.stringify(data)
    });

    if (response.ok) {
        let result = await response.json();
        alert(`Form '${result.name}' saved successfully!`);
    } else {
        let error = await response.json();
        alert("Error: " + JSON.stringify(error));
    }
}

function getCookie(name) {
    let cookieValue = null;

    if (document.cookie && document.cookie !== "") {
        const cookies = document.cookie.split(";");

        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();

            if (cookie.substring(0, name.length + 1) === (name + "=")) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }

    return cookieValue;
}
</script>

</body>
</html>
