<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GIS Dynamic Form Builder</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
    background:#f5f3ee;
}

.field-card{
    background:white;
    border:1px solid #e8e2d5;
    border-radius:12px;
    padding:16px;
    margin-bottom:16px;
}

.field-input{
    width:100%;
    padding:10px;
    border:1px solid #d4c9b0;
    border-radius:8px;
}

.field-input:focus{
    outline:none;
    border-color:#3a7ca5;
}

.btn{
    padding:8px 12px;
    border-radius:8px;
    border:none;
    cursor:pointer;
}

.btn-dark{
    background:#2a2219;
    color:white;
}

.btn-green{
    background:#4a6741;
    color:white;
}

.btn-blue{
    background:#3a7ca5;
    color:white;
}

.remove-btn{
    color:red;
    background:none;
    border:none;
    cursor:pointer;
}

.option-row{
    display:flex;
    gap:8px;
    margin-top:8px;
}

.section-label{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:#666;
    margin-bottom:4px;
}

</style>
</head>

<body class="p-8">

<div class="max-w-4xl mx-auto">

    <!-- PAGE HEADER -->
    <h1 class="text-3xl font-bold mb-6">
        GIS Dynamic Form Builder
    </h1>

    <!-- FORM NAME -->
    <div class="bg-white p-5 rounded-xl shadow-sm mb-6">

        <label class="block mb-2 font-semibold">
            Form Name
        </label>

        <input
            id="form-name"
            class="field-input"
            placeholder="Example: Farmer Registration Form"
        >

    </div>

    <!-- TOOLBAR -->
    <div class="flex gap-2 flex-wrap mb-6">

        <button class="btn btn-dark"
                onclick="addField('text')">
            + Text
        </button>

        <button class="btn btn-dark"
                onclick="addField('number')">
            + Number
        </button>

        <button class="btn btn-dark"
                onclick="addField('date')">
            + Date
        </button>

        <button class="btn btn-blue"
                onclick="addField('gps')">
            + GPS
        </button>

        <button class="btn btn-green"
                onclick="addField('dropdown')">
            + Dropdown
        </button>

    </div>

    <!-- FIELDS -->
    <div id="fields-container"></div>

    <button
        onclick="saveForm()"
        class="btn btn-green w-full mt-4">

        Save Form

    </button>

</div>

<script>

const fieldsContainer =
    document.getElementById("fields-container");

let fieldCounter = 0;

/////////////////////////////////////////////////////////
// ADD FIELD
/////////////////////////////////////////////////////////

function addField(type){

    fieldCounter++;

    let html = "";

    switch(type){

        case "text":
            html = createFieldCard("text");
            break;

        case "number":
            html = createFieldCard("number");
            break;

        case "date":
            html = createFieldCard("date");
            break;

        case "gps":
            html = createGPSCard();
            break;

        case "dropdown":
            html = createDropdownCard(fieldCounter);
            break;
    }

    fieldsContainer.insertAdjacentHTML(
        "beforeend",
        html
    );
}

/////////////////////////////////////////////////////////
// STANDARD FIELD
/////////////////////////////////////////////////////////

function createFieldCard(type){

    return `
    <div class="field-card">

        <div class="section-label">
            Field Label
        </div>

        <input
            class="field-input field-label"
            placeholder="Enter field label">

        <input
            type="hidden"
            class="field-type"
            value="${type}">

        <button
            class="remove-btn mt-3"
            onclick="this.parentElement.remove()">

            Remove Field

        </button>

    </div>
    `;
}

/////////////////////////////////////////////////////////
// GPS FIELD
/////////////////////////////////////////////////////////

function createGPSCard(){

    return `
    <div class="field-card">

        <div class="section-label">
            GPS Field Label
        </div>

        <input
            class="field-input field-label"
            placeholder="GPS Location">

        <input
            type="hidden"
            class="field-type"
            value="gps">

        <button
            class="remove-btn mt-3"
            onclick="this.parentElement.remove()">

            Remove Field

        </button>

    </div>
    `;
}

/////////////////////////////////////////////////////////
// DROPDOWN FIELD
/////////////////////////////////////////////////////////

function createDropdownCard(id){

    return `
    <div class="field-card dropdown-card">

        <div class="section-label">
            Dropdown Label
        </div>

        <input
            class="field-input field-label"
            placeholder="Crop Type">

        <input
            type="hidden"
            class="field-type"
            value="dropdown">

        <div class="mt-4">

            <div class="section-label">
                Dropdown Preview
            </div>

            <select
                id="preview-${id}"
                class="field-input dropdown-preview">

                <option>
                    Select option
                </option>

            </select>

        </div>

        <div class="options-container mt-4"></div>

        <button
            class="btn btn-blue mt-3"
            onclick="addOption(this, ${id})">

            + Add Option

        </button>

        <button
            class="remove-btn mt-3"
            onclick="this.parentElement.remove()">

            Remove Field

        </button>

    </div>
    `;
}

/////////////////////////////////////////////////////////
// ADD OPTION
/////////////////////////////////////////////////////////

function addOption(button,id){

    const container =
        button.parentElement
              .querySelector(".options-container");

    const html = `
    <div class="option-row">

        <input
            class="field-input option-input"
            placeholder="Option"

            oninput="updateDropdownPreview(${id}, this)">

        <button
            class="remove-btn"
            onclick="removeOption(this, ${id})">

            X

        </button>

    </div>
    `;

    container.insertAdjacentHTML(
        "beforeend",
        html
    );

    refreshDropdown(id);
}

/////////////////////////////////////////////////////////
// REMOVE OPTION
/////////////////////////////////////////////////////////

function removeOption(button,id){

    button.parentElement.remove();

    refreshDropdown(id);
}

/////////////////////////////////////////////////////////
// UPDATE OPTION
/////////////////////////////////////////////////////////

function updateDropdownPreview(id){

    refreshDropdown(id);
}

/////////////////////////////////////////////////////////
// REFRESH DROPDOWN
/////////////////////////////////////////////////////////

function refreshDropdown(id){

    const card =
        document
        .querySelector(`#preview-${id}`)
        .closest(".dropdown-card");

    const preview =
        document.getElementById(`preview-${id}`);

    preview.innerHTML =
        `<option>Select option</option>`;

    card.querySelectorAll(".option-input")
    .forEach(input => {

        if(input.value.trim()){

            preview.innerHTML += `
            <option>
                ${input.value}
            </option>
            `;
        }
    });
}

/////////////////////////////////////////////////////////
// SAVE FORM
/////////////////////////////////////////////////////////

async function saveForm() {

    const formName =
        document.getElementById("form-name")
        .value.trim();

    if (!formName) {
        alert("Please enter a form name.");
        return;
    }

    const structure = [];

    document
    .querySelectorAll(".field-card")
    .forEach(card => {

        const label =
            card.querySelector(".field-label")
            ?.value
            ?.trim();

        const type =
            card.querySelector(".field-type")
            ?.value;

        if (!label) return;

        const field = {
            label: label,
            type: type
        };

        if (type === "dropdown") {

            field.options = [];

            card.querySelectorAll(".option-input")
            .forEach(opt => {

                if (opt.value.trim()) {
                    field.options.push(opt.value.trim());
                }
            });
        }

        structure.push(field);
    });

    const payload = {
        name: formName,
        structure: structure
    };

    try {

        const response = await fetch("/api/forms/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": getCookie("csrftoken")
            },
            body: JSON.stringify(payload)
        });

        if (response.ok) {

            const result = await response.json();

            alert(
                `Form "${result.name}" saved successfully`
            );

            console.log(result);

        } else {

            const error =
                await response.json();

            console.error(error);

            alert(
                "Failed to save form."
            );
        }

    } catch (err) {

        console.error(err);

        alert(
            "Network error while saving form."
        );
    }
}

function getCookie(name) {

    let cookieValue = null;

    if (document.cookie &&
        document.cookie !== '') {

        const cookies =
            document.cookie.split(';');

        for (let cookie of cookies) {

            cookie = cookie.trim();

            if (
                cookie.startsWith(
                    name + '='
                )
            ) {

                cookieValue =
                    decodeURIComponent(
                        cookie.substring(
                            name.length + 1
                        )
                    );

                break;
            }
        }
    }

    return cookieValue;
}

</script>

</body>
</html>
