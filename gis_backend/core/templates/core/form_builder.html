<!DOCTYPE html>
<html>
<head>
    <title>GIS Form Builder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body">
            <h1 class="card-title mb-4">Create GIS Survey Form</h1>
            <div class="mb-3">
                <label class="form-label fw-bold">Form Name</label>
                <input type="text" id="form-name" class="form-control">
            </div>
            <button onclick="addField()" class="btn btn-secondary mb-3">
                + Add Field
            </button>
            <div id="fields-container"></div>
            <button onclick="saveForm()" class="btn btn-primary mt-3">
                Save Form
            </button>
        </div>
    </div>
</div>

<script>
function addField() {
    let fieldHTML = `
        <div class="card mb-2">
            <div class="card-body row g-3">
                <div class="col-md-6">
                    <label class="form-label">Field Label</label>
                    <input type="text" class="form-control field-label" placeholder="Enter label">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Field Type</label>
                    <select class="form-select field-type">
                        <option value="text">Text</option>
                        <option value="number">Number</option>
                        <option value="dropdown">Dropdown</option>
                        <option value="date">Date</option>
                        <option value="gps">GPS</option>
                        <option value="photo">Photo</option>
                    </select>
                </div>
            </div>
        </div>
    `;
    document.getElementById("fields-container")
        .insertAdjacentHTML("beforeend", fieldHTML);
}

async function saveForm() {
    let labels = document.querySelectorAll(".field-label");
    let types  = document.querySelectorAll(".field-type");
    let structure = [];
    for (let i = 0; i < labels.length; i++) {
        structure.push({ label: labels[i].value, type: types[i].value });
    }

    let data = {
        name: document.getElementById("form-name").value,
        structure: structure
    };

    let response = await fetch("/api/forms/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCookie('csrftoken')
        },
        body: JSON.stringify(data)
    });

    if (response.ok) {
        let result = await response.json();
        alert("Form '" + result.name + "' saved successfully!");
    } else {
        let error = await response.json();
        alert("Error: " + JSON.stringify(error));
    }
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
