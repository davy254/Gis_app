<!DOCTYPE html>
<html>
<head>
    <title>Dynamic GIS Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Georgia', 'serif'],
                    },
                    colors: {
                        earth: {
                            50:  '#f5f3ee',
                            100: '#e8e2d5',
                            200: '#d4c9b0',
                            300: '#baa98a',
                            400: '#9f8a67',
                            500: '#7d6a4f',
                            600: '#5e4f3a',
                            700: '#3e3426',
                            800: '#2a2219',
                            900: '#15110c',
                        },
                        moss:  '#4a6741',
                        sky:   '#3a7ca5',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f0ece3; }
 
        .field-card {
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }
        .field-card:focus-within {
            box-shadow: 0 4px 16px rgba(74,103,65,0.15);
            transform: translateY(-1px);
        }
 
        input[type="text"],
        input[type="number"],
        input[type="date"],
        input[type="file"] {
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #4a6741;
            box-shadow: 0 0 0 3px rgba(74,103,65,0.15);
        }
 
        @keyframes gps-pulse {
            0%   { box-shadow: 0 0 0 0 rgba(58,124,165,0.5); }
            70%  { box-shadow: 0 0 0 8px rgba(58,124,165,0); }
            100% { box-shadow: 0 0 0 0 rgba(58,124,165,0); }
        }
        .gps-pulsing { animation: gps-pulse 1.2s ease-out infinite; }
 
        .submit-btn {
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
        }
        .submit-btn:hover {
            background-color: #3e5a36;
            box-shadow: 0 4px 12px rgba(74,103,65,0.35);
            transform: translateY(-1px);
        }
        .submit-btn:active { transform: translateY(0); }
    </style>
</head>
 
<body class="min-h-screen flex items-start justify-center py-12 px-4">
 
<div class="w-full max-w-2xl">
 
    <!-- Header -->
    <div class="mb-8">
        <div class="flex items-center gap-2 mb-1">
            <svg class="w-5 h-5 text-moss" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
            </svg>
            <span class="text-xs uppercase tracking-widest text-earth-500 font-semibold">GIS Data Collection</span>
        </div>
        <h1 class="text-3xl font-bold text-earth-800 leading-tight">{{ form.name }}</h1>
        <div class="mt-2 h-0.5 w-16 bg-moss rounded"></div>
    </div>
 
    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-earth-100 overflow-hidden">
 
        <div class="bg-moss px-6 py-3 flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-white opacity-60"></div>
            <div class="w-2 h-2 rounded-full bg-white opacity-40"></div>
            <div class="w-2 h-2 rounded-full bg-white opacity-20"></div>
            <span class="ml-auto text-xs text-white/70 tracking-wide">Form ID: {{ form.id }}</span>
        </div>
 
        <div class="p-8">
            <form id="dynamic-form" class="space-y-6">
 
                <div id="fields-container" class="space-y-5"></div>
 
                <div class="pt-4 border-t border-earth-100">
                    <button type="submit"
                            class="submit-btn w-full bg-moss text-white font-semibold py-3 px-6 rounded-xl text-sm tracking-wide flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                        </svg>
                        Submit Data
                    </button>
                </div>
 
            </form>
        </div>
    </div>
 
    <p class="text-center text-xs text-earth-400 mt-6 tracking-wide">
        All field data is encrypted in transit &bull; GIS Survey Platform
    </p>
</div>
 
<!-- Toast -->
<div id="toast"
     class="fixed bottom-6 right-6 bg-earth-800 text-white text-sm px-5 py-3 rounded-xl shadow-lg
            transform translate-y-16 opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-2 max-w-xs">
    <svg id="toast-icon" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
    </svg>
    <span id="toast-msg"></span>
</div>
 
<script>
 
const structure = {{ structure|safe }};
 
const inputBase = "w-full px-4 py-2.5 rounded-lg border border-earth-200 bg-earth-50 text-earth-800 text-sm placeholder-earth-300 focus:outline-none";
 
const container = document.getElementById("fields-container");
 
function labelHTML(label, icon) {
    return `<label class="block text-xs font-semibold uppercase tracking-widest text-earth-500 mb-1.5 flex items-center gap-1.5">
                ${icon}${label}
            </label>`;
}
 
const icons = {
    text:   `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h10"/></svg>`,
    number: `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"/></svg>`,
    date:   `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path stroke-linecap="round" d="M16 2v4M8 2v4M3 10h18"/></svg>`,
    gps:    `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path stroke-linecap="round" d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>`,
    photo:  `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><circle cx="12" cy="13" r="3"/></svg>`,
};
 
structure.forEach(field => {
    let inner = '';
 
    if (field.type === 'text') {
        inner = `<input type="text" name="${field.label}" placeholder="Enter ${field.label.toLowerCase()}…"
                        class="${inputBase}">`;
    }
    else if (field.type === 'number') {
        inner = `<input type="number" name="${field.label}" placeholder="0"
                        class="${inputBase}">`;
    }
    else if (field.type === 'date') {
        inner = `<input type="date" name="${field.label}"
                        class="${inputBase}">`;
    }
    else if (field.type === 'gps') {
        inner = `
            <div class="flex gap-2 items-center">
                <button type="button" onclick="getLocation(this)"
                        class="flex items-center gap-2 px-4 py-2.5 rounded-lg bg-sky text-white text-sm font-semibold shrink-0 transition hover:bg-sky-600 active:scale-95">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="3"/>
                        <path stroke-linecap="round" d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
                    </svg>
                    Capture GPS
                </button>
                <input type="text" id="gps-location" readonly placeholder="Awaiting location…"
                       class="${inputBase} flex-1 cursor-default text-earth-600">
            </div>`;
    }
    else if (field.type === 'photo') {
        inner = `
            <label class="flex flex-col items-center justify-center w-full h-28 border-2 border-dashed border-earth-200
                          rounded-xl bg-earth-50 hover:bg-earth-100 cursor-pointer transition">
                <svg class="w-6 h-6 text-earth-300 mb-1" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 16v-8m0 0l-3 3m3-3l3 3M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1"/>
                </svg>
                <span class="text-xs text-earth-400">Click to upload photo</span>
                <input type="file" name="${field.label}" accept="image/*" class="hidden">
            </label>`;
    }
 
    const html = `
        <div class="field-card bg-earth-50 rounded-xl p-4 border border-earth-100">
            ${labelHTML(field.label, icons[field.type] || '')}
            ${inner}
        </div>`;
 
    container.insertAdjacentHTML('beforeend', html);
});
 
let latitude = null;
let longitude = null;
 
function getLocation(btn) {
    btn.classList.add('gps-pulsing');
    btn.textContent = 'Locating…';
 
    navigator.geolocation.getCurrentPosition(
        position => {
            latitude  = position.coords.latitude;
            longitude = position.coords.longitude;
            document.getElementById("gps-location").value = `${latitude.toFixed(6)}, ${longitude.toFixed(6)}`;
            btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg> Captured`;
            btn.classList.remove('gps-pulsing');
            btn.classList.replace('bg-sky', 'bg-moss');
        },
        () => {
            btn.textContent = 'Retry GPS';
            btn.classList.remove('gps-pulsing');
            showToast('Could not get location. Please try again.', false);
        }
    );
}
 
document.getElementById("dynamic-form").addEventListener("submit", async function(e) {
    e.preventDefault();
 
    const formData = new FormData(this);
    let collectedData = {};
    formData.forEach((value, key) => { collectedData[key] = value; });
 
    const payload = {
        form_id: {{ form.id }},
        data: collectedData,
        latitude,
        longitude
    };
 
    try {
        const response = await fetch('/submit-data/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(payload)
        });
        const result = await response.json();
        showToast(result.message, response.ok);
    } catch {
        showToast('Submission failed. Check your connection.', false);
    }
});
 
function showToast(message, success = true) {
    const toast   = document.getElementById('toast');
    const icon    = document.getElementById('toast-icon');
    const msg     = document.getElementById('toast-msg');
 
    msg.textContent = message;
    toast.classList.toggle('bg-earth-800', success);
    toast.classList.toggle('bg-red-700', !success);
 
    icon.innerHTML = success
        ? `<path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>`
        : `<path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>`;
 
    toast.classList.remove('translate-y-16', 'opacity-0');
    setTimeout(() => toast.classList.add('translate-y-16', 'opacity-0'), 3500);
}
 
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        for (const cookie of document.cookie.split(';')) {
            const c = cookie.trim();
            if (c.startsWith(name + '=')) {
                cookieValue = decodeURIComponent(c.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
 
</script>
</body>
</html>
